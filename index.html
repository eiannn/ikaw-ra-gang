<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>eian</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ffdde1, #ee9ca7);
      overflow: hidden;
      font-family: 'Poppins', sans-serif;
      color: #fff;
      text-align: center;
      position: relative;
    }

    .container-box {
      background: rgba(0, 0, 0, 0.4);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(6px);
      max-width: 400px;
      width: 90%;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 20px;
    }

    .btn-love {
      background: #ff4e50;
      border: none;
      padding: 15px 30px;
      font-size: 1.2rem;
      border-radius: 50px;
      color: #fff;
      cursor: pointer;
      transition: transform 0.3s ease, background 0.3s ease;
      animation: pulse 1.5s infinite;
    }

    .btn-love:hover {
      background: #ff1c1c;
      transform: scale(1.1);
    }

    /* Back button at top-left */
    .btn-back {
      position: absolute;
      top: 20px;
      left: 20px;
      background: #444;
      border: none;
      padding: 10px 25px;
      border-radius: 30px;
      color: #fff;
      cursor: pointer;
      display: none;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    /* Floating hearts background */
    .heart {
      position: absolute;
      color: rgba(255, 255, 255, 0.6);
      font-size: 20px;
      animation: float 8s linear infinite;
    }

    @keyframes float {
      0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- Back button now top-left -->
  <button class="btn-back" id="backBtn">Back</button>

  <div class="container-box" id="messageBox">
    <h1></h1>
    <button class="btn-love" id="loveBtn">Click this shiit</button>
  </div>

  <!-- Audio -->
  <audio id="bgMusic" src="bg-music.mp3"></audio>

  <!-- Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <script>
    const loveBtn = document.getElementById("loveBtn");
    const backBtn = document.getElementById("backBtn");
    const messageBox = document.getElementById("messageBox");
    const bgMusic = document.getElementById("bgMusic");

    loveBtn.addEventListener("click", () => {
      messageBox.querySelector("h1").innerText = "I miss you baby!😘 ni kaon naka baby?";
      loveBtn.style.display = "none";
      backBtn.style.display = "inline-block";

      // Play music
      bgMusic.play();

      // Fire confetti
      confetti({
        particleCount: 200,
        spread: 100,
        origin: { y: 0.6 }
      });
    });

    backBtn.addEventListener("click", () => {
      messageBox.querySelector("h1").innerText = "I Miss You baby❤️";
      loveBtn.style.display = "inline-block";
      backBtn.style.display = "none";

      // Stop music
      bgMusic.pause();
      bgMusic.currentTime = 0;
    });

    // Generate floating hearts
    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerHTML = "❤️";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = Math.random() * 20 + 15 + "px";
      document.body.appendChild(heart);

      setTimeout(() => heart.remove(), 8000);
    }
    setInterval(createHeart, 1000);
  </script>
</body>
</html>
